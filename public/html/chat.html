<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Chat — Employee Portal</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo">Employee Portal</div>
      <a href="profile.html" class="nav-item">Dashboard</a>
      <a href="chat.html" class="nav-item active">Chat</a>
      <a href="login.html" class="nav-item" id="nav-logout-2">Logout</a>
    </aside>

    <main class="header">
      <div class="topbar card">
        <div>
          <strong>Chat</strong>
          <div class="small-muted">Public room plus private threads</div>
        </div>
        <div class="profile-mini">
          <img id="topAvatarChat" src="../assets/placeholder-avatar.svg" alt="avatar">
          <div>
            <div id="topNameChat">Loading...</div>
            <div class="small-muted" id="topEmailChat"></div>
          </div>
        </div>
      </div>

      <div class="page-content">
        <section class="card section" style="flex: 0.65">
          <h3>Conversation</h3>
          <div id="messages" class="messages"></div>

          <div style="display:flex;gap:8px;margin-top:12px">
            <input id="messageInput" placeholder="Type a message..." class="input" style="flex:1">
            <button id="sendBtn" class="btn">Send</button>
          </div>
        </section>

        <aside class="card section" style="flex: 0.35">
          <h3>Users</h3>
          <div id="usersList" class="user-list"></div>
          <hr style="margin:12px 0">
          <div class="small-muted">Tip: click a user to start a private chat.</div>
        </aside>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <script src="../js/firebaseConfig.js"></script>
  <script src="../js/chat.js"></script>
</body>
</html>
