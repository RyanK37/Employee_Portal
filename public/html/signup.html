<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign Up — Employee Portal</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="small-muted">Employee Portal</div>
      <h1>Create your account</h1>
      <p class="small-muted" style="margin:6px 0 18px 0;">Spin up your profile to join announcements and chat.</p>

      <div class="field" style="margin-bottom:12px">
        <label>Full name</label>
        <input type="text" id="name" placeholder="Ada Lovelace">
      </div>
      <div class="field" style="margin-bottom:12px">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@company.com">
      </div>
      <div class="field" style="margin-bottom:18px">
        <label>Password</label>
        <input type="password" id="password" placeholder="********">
      </div>
      <button id="signupBtn" class="btn">Sign up</button>
      <p class="small-muted" style="margin-top:14px">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebaseConfig.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
