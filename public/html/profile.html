<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Dashboard — Employee Portal</title>
  <link rel="stylesheet" href="../css/styles.css">
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <div class="container">
    <aside class="sidebar card">
      <div class="logo">Employee Portal</div>
      <a href="profile.html" class="nav-item">🏠 Dashboard</a>
      <a href="chat.html" class="nav-item">💬 Chat</a>
      <a href="login.html" class="nav-item" id="nav-logout">🔒 Logout</a>
      <div style="margin-top:auto;font-size:12px;color:var(--muted)">v1.0 • Professional</div>
    </aside>

    <main class="header">
      <div class="topbar card">
        <div>
          <strong>Dashboard</strong>
          <div class="small-muted">Welcome — announcements & requests</div>
        </div>
        <div class="profile-mini">
          <img id="topAvatar" src="../css/placeholder-avatar.png" alt="avatar">
          <div>
            <div id="topName">Loading...</div>
            <div class="small-muted" id="topEmail"></div>
          </div>
        </div>
      </div>

      <div class="page-content" style="align-items:flex-start;">
        <section style="flex: 0.9" class="card">
          <!-- Announcements header -->
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h3>Announcements</h3>
              <div class="small-muted">Company-wide posts — like & comment</div>
            </div>
            <div id="adminControls" style="display:none">
              <button class="btn" id="openComposer">New Announcement</button>
            </div>
          </div>

          <!-- Composer (admin) -->
          <div id="composerWrap" style="margin-top:12px;display:none" class="announce-composer card">
            <input id="announceTitle" placeholder="Announcement title">
            <textarea id="announceBody" rows="4" placeholder="Write your announcement..."></textarea>
            <div style="display:flex;gap:8px">
              <button id="postAnnouncement" class="btn">Post</button>
              <button id="cancelAnnouncement" class="btn-ghost">Cancel</button>
            </div>
          </div>

          <!-- Announcements list -->
          <div id="announcements" class="announcements" style="margin-top:12px">
            <!-- announcements dynamically inserted here -->
          </div>
        </section>

        <aside style="flex: 0.45" class="card">
          <h3>Leave Requests</h3>

          <!-- Leave request form -->
          <div class="leave-card">
            <div class="field">
              <label>Type</label>
              <select id="leaveType">
                <option value="annual">Annual Leave</option>
                <option value="sick">Sick Leave</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field">
              <label>From</label>
              <input type="date" id="leaveFrom">
            </div>
            <div class="field">
              <label>To</label>
              <input type="date" id="leaveTo">
            </div>
            <div class="field">
              <label>Reason</label>
              <textarea id="leaveReason" rows="3"></textarea>
            </div>
            <div>
              <button id="submitLeave" class="btn">Submit Request</button>
            </div>
          </div>

          <hr style="margin:12px 0">

          <h4>Your Requests</h4>
          <div id="yourRequests" style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
          
          </div>

          <div id="pendingApprovalsWrap" style="margin-top:12px;display:none">
            <h4>Pending Approvals</h4>
            <div id="pendingApprovals" style="display:flex;flex-direction:column;gap:8px"></div>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <!-- Firebase compat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <!-- App scripts -->
  <script src="../js/firebaseConfig.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
